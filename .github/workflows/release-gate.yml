name: Release Gate

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: aungmyatm187-ship-it/ember-lite
          path: ember-lite
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt -r ember-lite/requirements.txt
      - name: Run ember-lite release gate
        run: python ember-lite/scripts/run_gate.py | tee gate.out
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const out = fs.readFileSync('gate.out', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚦 Ember Release Gate\n\n\`\`\`\n${out}\n\`\`\`\n\n_Evaluation produced by the Ember P5 release gate (ember-lite)._`
            });
